stages: 
  - lint
  - test
  - sast
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

.python-base:
  image: python:3.12
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

lint-job:
  extends: .python-base
  stage: lint
  before_script:
    - echo "Start linting"
  script:
    - pip install ruff
    - ruff check app tests --output-format=junit > ruff-junit.xml || true
  artifacts:
    when: always
    reports:
      junit: ruff-junit.xml


test:
  extends: .python-base
  stage: test
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week

# ---------- sast ----------

# Официальный шаблон SAST (в CE работает)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Переопределяем, чтобы запускалось только на push и не на каждый MR-пайплайн
semgrep-sast:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

secret_detection:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'


build-push-image:
  stage: build
  image: docker:24
  before_script:
    - pwd
    - ls
    - cat Dockerfile
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" .
    - sleep 5
    #- docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$IMAGE_TAG"
    #- docker push "$CI_REGISTRY_IMAGE:latest"

# ---------- deploy ----------

deploy:
  stage: deploy
  image: docker:24
  variables:
    APP_NAME: "vuln-api"
    HOST_PORT: "8000"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE_TAG"
    - docker rm -f "$APP_NAME" || true
    - >
      docker run -d
      --name "$APP_NAME"
      --restart always
      -p "$HOST_PORT:8000"
      "$IMAGE_TAG"
    - sleep 3
    - docker ps --filter "name=$APP_NAME"
  after_script:
    - docker ps --filter "name=$APP_NAME"
  environment:
    name: production
    url: http://192.168.0.128:8000
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

